name: V2ex

#on:

on:
 schedule:
    - cron: "0 02 * * *"
    - cron: "0 09 * * *"
    - cron: "0 11 * * *"
 workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: yanglbme/v2ex-action@main
        with:
          webhook: ${{ vars.WEBHOOK }}
          secret: ${{ secrets.SECRET }}
          count: 20
